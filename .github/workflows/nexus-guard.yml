name: Nexus Kit Spec Guard

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  spec-guard:
    name: Enforce SDD Spec Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run Spec Guard Action
        uses: ./
        with:
          base: ${{ github.base_ref || 'origin/main' }}
          strict: 'true'
          comment-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
