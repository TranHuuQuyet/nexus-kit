name: CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-cli:
    name: Validate create-nexus-kit CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test npm pack (Dry Run)
        run: |
          cd create-nexus-kit
          npm pack --dry-run

      - name: Test CLI Scaffolding & Doctor
        run: |
          node create-nexus-kit/bin/index.js test-app
          test -f test-app/.specify/constitution.md
          test -f test-app/.specify/templates/spec-template.md
          test -f test-app/.agents/skills/sdd-planner/SKILL.md
          test -f test-app/.agents/skills/sdd-coder/SKILL.md
          test -f test-app/.agents/skills/sdd-verifier/SKILL.md
          test -f test-app/CLAUDE.md
          test -f test-app/.cursor/rules/nexus-kit.mdc
          test -f test-app/.github/copilot-instructions.md
          test -f test-app/README.md
          test -f test-app/.gitignore
          node create-nexus-kit/bin/index.js --doctor test-app
          rm -rf test-app

      - name: Test Bash Install Script
        run: |
          bash create-nexus-kit/install.sh test-bash-app
          test -f test-bash-app/.specify/constitution.md
          test -f test-bash-app/.specify/templates/spec-template.md
          test -f test-bash-app/.agents/skills/sdd-planner/SKILL.md
          test -f test-bash-app/.agents/skills/sdd-coder/SKILL.md
          test -f test-bash-app/.agents/skills/sdd-verifier/SKILL.md
          test -f test-bash-app/CLAUDE.md
          test -f test-bash-app/.cursor/rules/nexus-kit.mdc
          test -f test-bash-app/.github/copilot-instructions.md
          node create-nexus-kit/bin/index.js --doctor test-bash-app
          rm -rf test-bash-app

      - name: Run Doctor on Root Repository
        run: node create-nexus-kit/bin/index.js --doctor .

  validate-skills:
    name: Validate Agent Skills Standard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Skills Structure & Frontmatter
        run: |
          for skill in .agents/skills/*/SKILL.md; do
            echo "Checking $skill..."
            head -n 1 "$skill" | grep -q -- "---" || { echo "Missing YAML frontmatter start in $skill"; exit 1; }
            grep -q "name:" "$skill" || { echo "Missing name field in $skill"; exit 1; }
            grep -q "description:" "$skill" || { echo "Missing description field in $skill"; exit 1; }
            grep -q "## When to use" "$skill" || { echo "Missing When to use section in $skill"; exit 1; }
            grep -q "## Workflow" "$skill" || { echo "Missing Workflow section in $skill"; exit 1; }
            echo "✔ $skill is valid!"
          done
